<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ma OTP LichSuAI</title>
  </head>
  <body style="margin:0;padding:0;background:#f6f7fb;font-family:Arial,sans-serif;color:#1f2937;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="padding:24px 12px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#ffffff;border-radius:14px;border:1px solid #e5e7eb;">
            <tr>
              <td style="padding:24px;">
                <h1 style="margin:0 0 12px;font-size:22px;line-height:1.3;color:#111827;">Xac thuc OTP</h1>
                <p style="margin:0 0 16px;font-size:14px;line-height:1.6;">
                  Xin chao,
                  <br />
                  Ban dang thuc hien xac thuc tai khoan tren LichSuAI.
                </p>
                <p style="margin:0 0 8px;font-size:13px;color:#6b7280;">Ma OTP cua ban:</p>
                <div style="margin:0 0 20px;padding:14px 18px;border-radius:12px;background:#fff7ed;border:1px dashed #fb923c;font-size:30px;font-weight:700;letter-spacing:6px;text-align:center;color:#9a3412;">
                  {{ .Token }}
                </div>
                <p style="margin:0 0 8px;font-size:14px;line-height:1.6;">
                  Ma OTP co hieu luc trong 1 gio. Khong chia se ma nay voi bat ky ai.
                </p>
                <p style="margin:0;font-size:12px;line-height:1.6;color:#6b7280;">
                  Neu ban khong thuc hien yeu cau nay, hay bo qua email.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
