<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dang nhap bang ma OTP</title>
  </head>
  <body style="margin:0;padding:0;background:#f6f7fb;font-family:Arial,sans-serif;color:#111827;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="padding:24px 12px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#ffffff;border-radius:14px;border:1px solid #e5e7eb;">
            <tr>
              <td style="padding:24px;">
                <h1 style="margin:0 0 12px;font-size:22px;line-height:1.3;">Dang nhap bang ma OTP</h1>
                <p style="margin:0 0 10px;font-size:14px;line-height:1.7;">
                  Xin chao {{ .Email }}, ban vua yeu cau dang nhap.
                </p>
                <p style="margin:0 0 8px;font-size:13px;color:#6b7280;">Ma dang nhap:</p>
                <div style="margin:0 0 16px;padding:14px 16px;border-radius:12px;background:#eff6ff;border:1px dashed #60a5fa;font-size:30px;letter-spacing:6px;font-weight:700;text-align:center;color:#1d4ed8;">
                  {{ .Token }}
                </div>
                <p style="margin:0 0 16px;font-size:14px;line-height:1.7;">
                  Vui long nhap ma de xac minh
                </p>
                <p style="margin:0;font-size:12px;line-height:1.7;color:#6b7280;">
                  Neu ban khong yeu cau dang nhap, bo qua email nay.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
